<!DOCTYPE html>
<html>
<head>
    <title>Casino Online</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">
        <h1>🎰 Casino Online</h1>

        <h2>Registro</h2>
        <input id="regUser" placeholder="Usuario">
        <input id="regPass" type="password" placeholder="Contraseña">
        <button onclick="register()">Crear cuenta</button>

        <hr>

        <h2>Login</h2>
        <input id="logUser" placeholder="Usuario">
        <input id="logPass" type="password" placeholder="Contraseña">
        <button onclick="login()">Entrar al casino</button>

        <p id="result"></p>
    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
